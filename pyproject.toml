[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exploration-testautomation"
version = "0.1.0"
description = "Cross-framework browser automation exploration for testharness-webapps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.22.0",
    "playwright>=1.40",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]
playwright = [
    "playwright>=1.40",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/exploration_ta"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
